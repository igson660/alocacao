name: Build Windows portable app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Instalar dependências fixadas
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Obter a revisão local do modelo
        shell: pwsh
        run: python scripts/download_model.py

      - name: Verificar tipos do código
        shell: pwsh
        run: python -m py_compile main.py analysis_runtime.py

      - name: Compilar aplicação portátil
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean app.spec

      - name: Montar recursos locais
        shell: pwsh
        run: |
          $out = "dist/PMAC-Analise-Formacao"
          New-Item -ItemType Directory -Force "$out/notebook", "$out/assets", "$out/models" | Out-Null
          Copy-Item "notebook/ferramenta_preditiva_pmac.ipynb" "$out/notebook/"
          Copy-Item "assets/*" "$out/assets/" -Exclude "pmac.ico"
          Copy-Item "licenses/Apache-2.0.txt" "$out/"
          Copy-Item "licenses/NOTICE.txt" "$out/AVISOS-TERCEIROS.txt"
          Copy-Item "LICENSES.md" "$out/"
          New-Item -ItemType Directory -Force "$out/models/paraphrase-multilingual-MiniLM-L12-v2" | Out-Null
          Copy-Item "models/paraphrase-multilingual-MiniLM-L12-v2/*" "$out/models/paraphrase-multilingual-MiniLM-L12-v2/" -Recurse -Force
          Copy-Item "README.md" "$out/LEIA-ME.txt"

      - name: Smoke test sem interface gráfica
        shell: pwsh
        run: |
          $exe = "dist/PMAC-Analise-Formacao/PMAC-Analise-Formacao.exe"
          $inputFile = "tests/fixtures/mini_pmac.csv"
          $out = Join-Path $env:RUNNER_TEMP "pmac-smoke-out"
          $events = Join-Path $env:RUNNER_TEMP "pmac-smoke-events.jsonl"
          if (!(Test-Path $exe)) { throw "Executável não encontrado: $exe" }
          if (!(Test-Path "dist/PMAC-Analise-Formacao/models/paraphrase-multilingual-MiniLM-L12-v2/model.safetensors")) { throw "Modelo offline não encontrado" }
          & $exe --worker $inputFile $out --event-file $events
          $workerExitCode = $LASTEXITCODE
          if ($null -ne $workerExitCode -and $workerExitCode -ne 0) { throw "Worker encerrou com código $workerExitCode" }
          if (!(Test-Path $events)) { throw "O worker não criou o arquivo de eventos" }
          $eventText = Get-Content $events -Raw
          if ($eventText -notmatch '"event": "run_completed"') { throw "O executável não emitiu run_completed" }
          $expected = @("resultado_analise_pmac_completo.csv", "resultado_analise_pmac_aplicavel.csv", "auditoria_classificacao_unidades.csv")
          foreach ($name in $expected) { if (!(Test-Path (Join-Path $out $name))) { throw "Saída não encontrada: $name" } }
          Get-ChildItem "dist/PMAC-Analise-Formacao" -Recurse | Measure-Object -Property Length -Sum | Format-List

      - name: Compactar pasta portátil
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/PMAC-Analise-Formacao" -DestinationPath "PMAC-Analise-Formacao-Windows-x64.zip" -CompressionLevel Optimal
          Get-FileHash "PMAC-Analise-Formacao-Windows-x64.zip" -Algorithm SHA256 | Format-List

      - name: Publicar artefato para download
        uses: actions/upload-artifact@v4
        with:
          name: PMAC-Analise-Formacao-Windows-x64
          path: PMAC-Analise-Formacao-Windows-x64.zip
          retention-days: 30
